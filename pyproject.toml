[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "master-character"
version = "2.1.0"
description = "Persistent founder-aligned meta-agent kernel that creates, operates, evaluates, and evolves specialist agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ryan / Under My Enterprise"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.5,<1",
]

[project.scripts]
master-character = "master_character.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/master_character"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
