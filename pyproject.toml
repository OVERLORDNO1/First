[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "J.A.R.V.I.S. — a personal AI assistant with persistent memory, reminders, and a plugin architecture, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.66",
    "pydantic-settings>=2.4",
    "APScheduler>=3.10,<4",
    "rich>=13.0",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
