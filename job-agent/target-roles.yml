# What to search for. Edit these before running the job-apply skill.

titles:
  - "Vessel Planner"
  - "Senior Vessel Planner"
  - "Ship Planner"
  - "Stowage Planner"
  - "Ship Planning Coordinator"
  - "Marine/Vessel Operations Planner"
  - "Liner Trade/Service Coordinator"
  - "Alliance/Network Planner"

seniority:
  - "Senior"
  - "Mid-Senior"

locations:
  - "United Kingdom"
  - "Remote"
  - "Europe"

must_have_keywords:
  - "stowage"
  - "vessel planning"
  - "ship planning"
  - "liner"
  - "container"
exclude_keywords: []     # skip postings containing any of these

employment_types:
  - full_time

daily_application_cap: 15

# Minimum match score (0-100) for the skill to bother tailoring + applying.
# Raise this if you get too many low-quality matches, lower it if too few.
minimum_match_score: 70

sources:
  linkedin: true
  company_ats_boards: true   # Greenhouse / Lever / Ashby / Workday / direct sites
